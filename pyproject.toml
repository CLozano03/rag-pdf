[project]
name = "rag-pdf"
version = "0.1.0"
description = "Resumidor y Q&A de documentos PDF con RAG (modelos open source)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pdfplumber>=0.11",
    "langchain-text-splitters>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "faiss-cpu>=1.8",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.0",
]
